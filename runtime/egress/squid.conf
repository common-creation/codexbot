# Codexbot agents attach to an internal-only network containing this proxy.
# Only this proxy is also attached to an egress-capable network. Destination
# ACLs are evaluated after DNS resolution, which also blocks DNS rebinding to
# the host, private networks, and cloud metadata endpoints.

acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443

acl denied_ipv4 dst 0.0.0.0/8
acl denied_ipv4 dst 10.0.0.0/8
acl denied_ipv4 dst 100.64.0.0/10
acl denied_ipv4 dst 127.0.0.0/8
acl denied_ipv4 dst 169.254.0.0/16
acl denied_ipv4 dst 172.16.0.0/12
acl denied_ipv4 dst 192.0.0.0/24
acl denied_ipv4 dst 192.0.2.0/24
acl denied_ipv4 dst 192.88.99.0/24
acl denied_ipv4 dst 192.168.0.0/16
acl denied_ipv4 dst 198.18.0.0/15
acl denied_ipv4 dst 198.51.100.0/24
acl denied_ipv4 dst 203.0.113.0/24
acl denied_ipv4 dst 224.0.0.0/4
acl denied_ipv4 dst 240.0.0.0/4

acl denied_ipv6 dst ::/128
acl denied_ipv6 dst ::1/128
# Squid internally represents ordinary IPv4 destinations as IPv4-mapped IPv6
# addresses. Blocking the whole ::ffff:0:0/96 range would therefore reject all
# public IPv4 CONNECT requests as well. The denied_ipv4 networks above still
# reject mapped private, loopback, metadata, and reserved IPv4 destinations.
acl denied_ipv6 dst 64:ff9b::/96
acl denied_ipv6 dst 100::/64
acl denied_ipv6 dst 2001:db8::/32
acl denied_ipv6 dst fc00::/7
acl denied_ipv6 dst fe80::/10
acl denied_ipv6 dst ff00::/8

acl denied_hostname dstdomain localhost
acl denied_hostname dstdomain localhost.localdomain
acl denied_hostname dstdomain metadata.google.internal
acl denied_hostname dstdomain instance-data

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny denied_ipv4
http_access deny denied_ipv6
http_access deny denied_hostname
http_access allow all

http_port 3128

cache deny all
cache_mem 32 MB
maximum_object_size 0 KB
pid_filename none
pinger_enable off
access_log stdio:/dev/stdout
cache_log /dev/stderr
logfile_rotate 0
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
